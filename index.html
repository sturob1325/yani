<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanina Galeano — Paraguay Residency Specialist</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:300,400,700,900" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #2f89fc; /* Original site's blue color */
            --dark-gray: #333333;
            --white: #ffffff;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            color: var(--dark-gray);
            line-height: 1.7;
        }

        /* 1. Header & Navigation */
        .navbar {
            background-color: transparent;
            position: absolute;
            width: 100%;
            z-index: 1000;
            padding: 25px 0;
        }

        .navbar-brand {
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--white) !important;
        }

        .nav-link {
            color: rgba(255,255,255,0.7) !important;
            font-weight: 400;
            margin-left: 20px;
        }

        .nav-link:hover {
            color: var(--white) !important;
        }

        /* 2. Hero Section */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://sturob1325.github.io/yani/images/hero_1.jpg');
            background-size: cover;
            background-position: center center;
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--white);
        }

        .hero h1 {
            font-size: 4.5rem;
            font-weight: 300;
            margin-bottom: 30px;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 40px;
            font-weight: 300;
        }

        .btn-primary {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
            padding: 15px 35px;
            border-radius: 0;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">Yanina Galeano</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#services">Residency Help</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <h1 data-aos="fade-up">Paraguay Residency Specialist</h1>
                    <p data-aos="fade-up" data-aos-delay="100">Your dedicated legal partner for navigating residency, Cedula applications, and document legalization in Paraguay.</p>
                    <div data-aos="fade-up" data-aos-delay="200">
                        <a href="#contact" class="btn btn-primary">Start Your Application</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
